# Data configuration for jet classification with ParticleTransformerTagger.
# This is like ParticleTransformer but including secondary vertex information.

selection:

new_variables:
   pfcand_mask: ak.ones_like(pfcand_pt)
   sv_mask: ak.ones_like(sv_chi2Normalized)
   pfcand_pt_log: np.log(pfcand_pt)
   pfcand_e_log: np.log(pfcand_e)
   pfcand_drrel: np.hypot(pfcand_thetarel, pfcand_phirel)
   # Compute SV 4-momentum from angular coordinates and mass
   # Using jet direction as origin: theta_rel, phi_rel are relative to jet axis
   sv_px: sv_p * np.sin(sv_thetarel) * np.cos(sv_phirel) 
   sv_py: sv_p * np.sin(sv_thetarel) * np.sin(sv_phirel)
   sv_pz: sv_p * np.cos(sv_thetarel)
   sv_e: np.sqrt(sv_p**2 + sv_mass**2)
   # Log-scaled SV features to handle extreme values and prevent gradient explosion
   # Using np.maximum instead of np.clip for awkward array compatibility
   sv_dxy_log: np.log(np.maximum(sv_dxy, 0.001))
   sv_dxyz_log: np.log(np.maximum(sv_dxyz, 0.001))
   sv_p_log: np.log(np.maximum(sv_p, 0.001))
   sv_drrel: np.hypot(sv_thetarel, sv_phirel)

preprocess:
  method: manual
  data_fraction: 0.5

inputs:
   pf_points:
      length: 128
      pad_mode: wrap
      vars: 
         - [pfcand_thetarel, null]
         - [pfcand_phirel, null]
   pf_features:
      length: 128
      pad_mode: wrap
      vars: 
      ### [format 1]: var_name (no transformation)
      ### [format 2]: [var_name, 
      ###              subtract_by(optional, default=None, no transf. if preprocess.method=manual, auto transf. if preprocess.method=auto), 
      ###              multiply_by(optional, default=1), 
      ###              clip_min(optional, default=-5), 
      ###              clip_max(optional, default=5), 
      ###              pad_value(optional, default=0)]
         - [pfcand_pt_log, null]
         - [pfcand_e_log, null]
         - [pfcand_ptrel_log, null]
         - [pfcand_erel_log, null]
         - [pfcand_drrel, null]
         - [pfcand_thetarel, null]
         - [pfcand_phirel, null]
         - [pfcand_charge, null]
         - [pfcand_dxy, null]
         - [pfcand_dz, null]
         - [pfcand_Sip2dVal, null]
         - [pfcand_Sip2dSig, null]
         - [pfcand_Sip3dVal, null]
         - [pfcand_Sip3dSig, null]
         - [pfcand_JetDistVal, null]
         - [pfcand_JetDistSig, null]
         - [pfcand_linearSignedIP3D, null]
         - [pfcand_linearSignedIP3DSig, null]
         - [pfcand_transverseJetDistance, null]
         - [pfcand_longitudinalJetDistance, null]
         - [pfcand_isChargedHad, null]
         - [pfcand_isNeutralHad, null]
         - [pfcand_isGamma, null]
         - [pfcand_isEl, null]
         - [pfcand_isMu, null]
         - [pfcand_trackChi2Normalized, null]
         - [pfcand_nTrackHits_VDET, null]
         - [pfcand_nTrackHits_ITC, null]
         - [pfcand_nTrackHits_TPC, null]
   pf_vectors:
      length: 128
      pad_mode: wrap
      vars: 
         - [pfcand_px, null]
         - [pfcand_py, null]
         - [pfcand_pz, null]
         - [pfcand_e, null]
   pf_mask:
      length: 128
      pad_mode: constant
      vars: 
         - [pfcand_mask, null]
   sv_points:
      length: 5
      pad_mode: constant
      vars:
         - [sv_xrel, null]
         - [sv_yrel, null]
         - [sv_zrel, null]
         - [sv_p, null]
   sv_features:
      length: 5
      pad_mode: constant
      vars:
         # Use angular coords instead of cartesian (more stable range)
         - [sv_thetarel, 0, 1, -5, 5, 0]
         - [sv_phirel, 0, 1, -5, 5, 0]
         - [sv_drrel, 0, 1, -5, 5, 0]
         # Log-scaled features for large-range variables
         - [sv_p_log, 0, 1, -10, 5, 0]
         - [sv_prel, 0, 1, -5, 5, 0]
         - [sv_nTracks, 2, 1, -5, 5, 0]
         - [sv_mass, 0.5, 1, -5, 5, 0]
         - [sv_dxy_log, 0, 1, -10, 10, 0]
         - [sv_dxyz_log, 0, 1, -10, 10, 0]
         - [sv_chi2, 0, 1, -5, 5, 0]
         - [sv_chi2Normalized, 0, 1, -5, 5, 0]
         - [sv_cosPointing, 0, 1, -2, 2, 0]
   sv_mask:
      length: 5
      pad_mode: constant
      vars:
         - [sv_mask, null]
   sv_vectors:
      length: 5
      pad_mode: constant
      vars:
         - [sv_px, null]
         - [sv_py, null]
         - [sv_pz, null]
         - [sv_e, null]

labels:
   type: simple
   value: [recojet_isB, recojet_isC, recojet_isUDSG]

observers:
   - recojet_pt
   - recojet_eta
   - recojet_theta
   - recojet_phi
   - recojet_e
   - recojet_mass
   - nconst

weights:
   use_precomputed_weights: false
   reweight_basewgt: np.ones(len(recojet_pt))
   reweight_method: flat
   reweight_threshold: 0
   reweight_load_fraction: 1.
   reweight_vars:
      recojet_pt: [0., 30000.]
      recojet_e: [0., 30000.]
   reweight_discard_under_overflow: false
   reweight_classes: [recojet_isB, recojet_isC, recojet_isUDSG]
   class_weights: [1, 1, 1]
