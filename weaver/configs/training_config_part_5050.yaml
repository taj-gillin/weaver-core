# Training configuration file with Wandb Logging
# This config file specifies all the configs and settings needed for training

# Paths to config files (relative to this config file or absolute paths)
data_config: data_configs/data_config_part_standardized.yaml
model_config: model_config_part.py

# ============================================================================
# DATA CONFIGURATION - Choose ONE of the two options below:
# ============================================================================

# OPTION 1: Automatic train/test split 
# Define all data files and let the script split them automatically
data_files:
  - /HEP/data/share/aleph/ntuples-fitpv-withbs3/jetlevel/mc/output_qqb_*.root
train_test_split: 0.5 
split_seed: 42           # Optional: for reproducible splits

# OPTION 2: Separate sample files 
# Use pre-defined sample lists for train and test
# sample_train: samplelists/oscar/samples_training.yaml
# sample_test: samplelists/oscar/samples_testing.yaml

# Training hyperparameters
num_epochs: 100
steps_per_epoch: 300
batch_size: 512

# Output settings
output_dir: /oscar/data/lgouskos/training_runs/output_part_5050
model_prefix_name: network
test_output: output.root

# Data loading settings
num_workers: 8
copy_inputs: true

# Data Augmentation Settings  
augment: true
aug_rotation: false
aug_reflection: false
aug_dropout: 0.0

# Weights & Biases logging
use_wandb: true
wandb_project: jet-tagging
wandb_entity: aleph_project
wandb_name: part_standardized_5050
wandb_tags: ["part", "standardized"]
wandb_notes: "Baseline training with standardized data"

# Compute settings
gpus: '0'  # GPU IDs (comma-separated) or empty string for CPU

# torch.compile settings (PyTorch 2.0+, can speed up training significantly)
compile: true  
compile_mode: default  # Options: default, reduce-overhead, max-autotune

# Job submission settings
runmode: slurm  # local, condor, or slurm

# Slurm-specific settings
slurm_memory: 16G
slurm_time: 09:00:00
slurm_cpus: 6
conda_activate: source /users/tgillin/miniconda3/etc/profile.d/conda.sh
conda_env: weaver

# Condor-specific settings
condor_conda_activate: source /eos/user/l/llambrec/miniforge3/bin/activate
condor_jobflavour: workday

# Advanced options
keep_output_dir: false
